# English Language Configuration
prefix: "<gradient:#55ffff:#00aa00>[ChatConduit]</gradient> "

messages:
  no-permission: "<red>You do not have permission to execute this command!"
  reload-success: "<green>Configuration and language files reloaded successfully!"
  unknown-command: "<red>Unknown command, please use <yellow>/chatconduit help</yellow>."

gui:
  title-channel-select: "<gradient:#00d2ff:#3a7bd5><bold>Chat Channel Control Panel</bold></gradient>"
  title-message-settings: "<gradient:#ff9a9e:#fecfef><bold>Message Display Settings</bold></gradient>"

channel:
  current: "<gray>Your current active channel: <yellow><channel_name>"
  switched: "<green>Switched active channel to: <yellow><channel_name>"
  not-found: "<red>Channel not found!"
  no-permission: "<red>You do not have permission to access or switch to this channel!"
  not-in-group: "<red>You are no longer in this group channel! Reverted to default channel."

  # Channel Command Descriptions
  list-header: "<green>=== Available Channels ==="
  list-item: "<gray>- <yellow><key> <gray>(<white><name><gray>) Prefix: <gold><prefix_key>"

  # Player Custom Channels (/pc)
  create-usage: "<red>Usage: /playerchannel create <ChannelName>"
  create-success: "<green>Successfully created channel <yellow><name>!"
  create-exists: "<red>A channel with this name already exists!"
  create-limit-reached: "<red>You have reached the maximum channel creation limit (max <limit>)!"
  name-blacklisted: "<red>This channel name contains a reserved keyword and cannot be used!"
  name-invalid: "<red>Invalid channel name (must be <min>-<max> characters long without special characters)!"
  description-invalid: "<red>Channel description must be between 1 and <max> characters!"
  rules-invalid: "<red>Channel rules must be between 1 and <max> characters!"
  input-timeout: "<red>Chat input session expired and was cancelled automatically."
  only-members-manage: "<red>You must be a member of this channel to manage it!"
  webhook-testing: "<yellow>Testing connection to Discord Webhook URL..."
  webhook-test-success: "<green>✅ Webhook connection test successful! Test message sent to Discord."
  webhook-test-failed: "<red>❌ Webhook connection test failed! Reason: <yellow><reason>"
  webhook-not-bound: "<red>This channel does not have a Discord Webhook URL bound!"


  invite-usage: "<red>Usage: /playerchannel invite <Player>"
  invite-not-owner: "<red>You must be the owner of this channel to perform this action!"
  invite-player-not-found: "<red>Player not found!"
  invite-sent: "<green>Invitation sent to <yellow><player>."
  invite-received: "<yellow><player> invited you to [<green><name><yellow>]. Type <gold>/playerchannel accept <name> <yellow>to join!"

  accept-usage: "<red>Usage: /playerchannel accept <ChannelName>"
  accept-no-invite: "<red>You do not have a pending invitation for this channel!"
  accept-success: "<green>Successfully joined channel <yellow><name>!"

  # Member Management
  kick-usage: "<red>Usage: /playerchannel manage kick <Player>"
  kick-success: "<green>Successfully kicked <yellow><player> <green>from the channel."
  kick-not-member: "<red>This player is not in your channel!"
  kick-self: "<red>You cannot kick yourself!"
  kicked-notify: "<red>You have been kicked from channel <yellow><name><red>."

  leave-not-in-channel: "<red>You are not currently in a custom channel!"
  leave-owner-forbidden: "<red>As the channel owner, you cannot leave! Use /pc manage delete or transfer."
  leave-success: "<green>You have left channel <yellow><name><green>."

  transfer-usage: "<red>Usage: /playerchannel manage transfer <Player>"
  transfer-not-member: "<red>Target player must be online and a member of this channel!"
  transfer-success: "<green>Transferred channel ownership to <yellow><player><green>."
  transfer-notify: "<green>You are now the owner of channel <yellow><name><green>!"

  delete-success: "<red>Successfully deleted channel <yellow><name><red>."

help:
  header: "<green>=== ChatConduit Commands ==="
  help-cmd: "<yellow>/chatconduit help <gray>- Show this help menu"
  reload-cmd: "<yellow>/chatconduit reload <gray>- Reload configuration"

  channel-header: "<green>=== Channel Commands ==="
  channel-switch: "<yellow>/channel <Name> <gray>- Switch active channel"

  pc-header: "<green>=== Player Channel Management (/pc) ==="
  pc-create: "<yellow>/pc create <Name> <gray>- Create custom channel"
  pc-invite: "<yellow>/pc invite <Player> <gray>- Invite player"
  pc-accept: "<yellow>/pc accept <Name> <gray>- Accept invite"
  pc-leave: "<yellow>/pc leave <gray>- Leave current channel"
  pc-members: "<yellow>/pc members <gray>- List channel members"
  pc-kick: "<yellow>/pc manage kick <Player> <gray>- Kick member"
  pc-transfer: "<yellow>/pc manage transfer <Player> <gray>- Transfer ownership"
  pc-delete: "<yellow>/pc manage delete <gray>- Delete channel"

mute:
  chat-blocked: "<red>You are muted for <time> Reason: <reason>"
  chat-blocked-perm: "<red>You are permanently muted. Reason: <reason>"
  broadcast: "<gradient:#ff416c:#ff4b2b>[Server]</gradient> <red>Player <yellow><player></yellow> was muted for <yellow><time></yellow> by <yellow><by></yellow>. Reason: <gray><reason></gray>"
  broadcast-perm: "<gradient:#ff416c:#ff4b2b>[Server]</gradient> <red>Player <yellow><player></yellow> was permanently muted by <yellow><by></yellow>. Reason: <gray><reason></gray>"
  unmute-broadcast: "<gradient:#55ffff:#00aa00>[Server]</gradient> <green>Player <yellow><player></yellow> was unmuted by <yellow><by></yellow>."
  mute-usage: "<red>Usage: /mute <player> [duration (e.g. 5m, 1h)] [reason]"
  unmute-usage: "<red>Usage: /unmute <player>"
  mute-success: "<green>Successfully muted player <yellow><player></yellow> for <yellow><time></yellow>! Reason: <gray><reason></gray>"
  unmute-success: "<green>Successfully unmuted player <yellow><player></yellow>!"
  unmuted-notice: "<green>You have been unmuted. You can now chat again."
  not-muted: "<red>Player <yellow><player></yellow> is not currently muted!"
  default-reason: "No reason provided"
  permanent: "Permanent"
  list-empty: "<yellow>Currently there are no muted players."
  list-header: "<gradient:#ff416c:#ff4b2b><bold>=== Currently Muted Players (<count>) ===</bold></gradient>"
  list-item: "<gray>- <yellow><player></yellow> | Remaining: <aqua><time></aqua> | Reason: <white><reason></white> | By: <gray><by></gray>"

msg:
  usage: "<red>Usage: /msg <player> <message>"
  reply-usage: "<red>Usage: /reply <message>"
  player-not-found: "<red>Specified online player not found: <yellow><target>"
  cannot-msg-self: "<red>You cannot send a private message to yourself!"
  no-reply-target: "<red>You have no recent private message recipient to reply to!"
  disabled: "<red>Private messaging is currently disabled by administrator."

friend:
  usage: "<red>Usage: /friend <add|accept|deny|remove|list|block|unblock|gui|help>"
  add-success: "<green>Successfully sent friend request to <yellow><target><green>!"
  add-cooldown: "<red>Please wait before sending another friend request!"
  add-blocked: "<red>Cannot send friend request to this player!"
  add-already-friends: "<yellow><target> <red>is already your friend!"
  add-cannot-self: "<red>You cannot add yourself as a friend!"
  add-disabled: "<red>This player has disabled friend requests!"
  add-auto-accepted: "<green><target> had already sent you a request, you are now friends!"
  add-failed: "<red>Failed to send friend request. Please try again later."
  accept-success: "<green>You accepted the friend request from <yellow><target><green>!"
  accept-not-found: "<red>No pending friend request found from <yellow><target><red>!"
  accept-failed: "<red>Failed to accept friend request."
  deny-success: "<yellow>You denied the friend request from <yellow><target><yellow>."
  deny-not-found: "<red>No pending friend request found from <yellow><target><red>!"
  remove-success: "<yellow>Removed <white><target> <yellow>from your friends list."
  remove-not-friend: "<red><target> is not on your friends list!"
  block-success: "<green>Successfully added <yellow><target> <green>to blocklist!"
  block-cannot-self: "<red>You cannot block yourself!"
  block-failed: "<red>Failed to block player."
  unblock-success: "<green>Successfully removed <yellow><target> <green>from blocklist!"
  unblock-not-blocked: "<red><target> is not in your blocklist!"
  player-not-found: "<red>Player <yellow><target><red> not found!"
  list-header: "<gradient:#00FFA3:#00B8FF><bold>=== Friend List (Page <page>/<total_pages>, Total <total_friends>) ===</bold></gradient>"
  list-item-online: "<gray>- <green>● <yellow><name> <gray>(<aqua><server></aqua>)"
  list-item-offline: "<gray>- <dark_gray>● <gray><name> <dark_gray>(Offline)"
  list-empty: "<yellow>You currently have no friends."
  list-invalid-page: "<red>Invalid page number!"
  help-header: "<gradient:#00FFA3:#00B8FF><bold>=== Friend System Commands ===</bold></gradient>"
  help-add: "<yellow>/friend add <Player> <gray>- Send friend request"
  help-accept: "<yellow>/friend accept <Player> <gray>- Accept friend request"
  help-deny: "<yellow>/friend deny <Player> <gray>- Deny friend request"
  help-remove: "<yellow>/friend remove <Player> <gray>- Remove friend"
  help-list: "<yellow>/friend list [Page] <gray>- View friend list"
  help-block: "<yellow>/friend block <Player> <gray>- Block player"
  help-unblock: "<yellow>/friend unblock <Player> <gray>- Unblock player"
  help-gui: "<yellow>/friend gui <gray>- Open friend GUI"