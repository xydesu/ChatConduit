# 繁體中文語言設定檔
prefix: "<gradient:#55ffff:#00aa00>[ChatConduit]</gradient> "

messages:
  no-permission: "<red>你沒有權限執行此指令！"
  reload-success: "<green>設定檔與語言檔已成功重載！"
  unknown-command: "<red>未知的指令，請使用 <yellow>/chatconduit help</yellow>。"

gui:
  title-channel-select: "<gradient:#00d2ff:#3a7bd5><bold>聊天頻道控制台</bold></gradient>"
  title-message-settings: "<gradient:#ff9a9e:#fecfef><bold>個人訊息顯示設定</bold></gradient>"

channel:
  current: "<gray>你目前預設發言頻道為：<yellow><channel_name>"
  switched: "<green>已切換預設發言頻道至：<yellow><channel_name>"
  not-found: "<red>找不到指定的頻道！"
  no-permission: "<red>你沒有權限進入或切換至此頻道！"
  not-in-group: "<red>你已經不在該群組頻道內！已退回預設頻道。"

  # 頻道清單相關
  list-header: "<green>=== 伺服器可用頻道清單 ==="
  list-item: "<gray>- <yellow><key> <gray>(<white><name><gray>) 快速鍵: <gold><prefix_key>"

  # 玩家自訂頻道管理 (/pc)
  create-usage: "<red>用法: /playerchannel create <頻道名稱>"
  create-success: "<green>成功建立群組頻道 <yellow><name>！"
  create-exists: "<red>該頻道名稱已存在！"
  create-limit-reached: "<red>您創建的群組頻道數量已達上限（最多 <limit> 個）！"
  name-blacklisted: "<red>該名稱包含系統保留字，無法作為頻道名稱！"
  name-invalid: "<red>頻道名稱格式無效（長度需在 <min>-<max> 個字元，且不可包含特殊符號）！"
  description-invalid: "<red>頻道簡介長度必須介於 1 至 <max> 個字元！"
  rules-invalid: "<red>頻道守則長度必須介於 1 至 <max> 個字元！"
  input-timeout: "<red>對話框輸入已逾時，自動取消操作。"
  only-members-manage: "<red>你必須是該頻道的成員才能進行管理！"
  webhook-testing: "<yellow>正在連線測試 Discord Webhook URL..."
  webhook-test-success: "<green>✅ Webhook 連線測試成功！測試訊息已送達 Discord 頻道。"
  webhook-test-failed: "<red>❌ Webhook 連線測試失敗！原因: <yellow><reason>"
  webhook-not-bound: "<red>該頻道尚未綁定 Discord Webhook 網址！"


  invite-usage: "<red>用法: /playerchannel invite <玩家名稱>"
  invite-not-owner: "<red>你必須是你當前所在自訂頻道的隊長才能執行此操作！"
  invite-player-not-found: "<red>找不到該玩家！"
  invite-sent: "<green>已傳送邀請給 <yellow><player>。"
  invite-received: "<yellow><player> 邀請你加入頻道 [<green><name><yellow>]，請輸入 <gold>/playerchannel accept <name> <yellow>加入！"

  accept-usage: "<red>用法: /playerchannel accept <頻道名稱>"
  accept-no-invite: "<red>你沒有收到該頻道的邀請！"
  accept-success: "<green>成功加入群組頻道 <yellow><name>！"

  # 玩家頻道成員管理
  kick-usage: "<red>用法: /playerchannel manage kick <玩家名稱>"
  kick-success: "<green>已成功將 <yellow><player> <green>踢出頻道。"
  kick-not-member: "<red>該玩家不在你的頻道內！"
  kick-self: "<red>你不能將自己踢出頻道！"
  kicked-notify: "<red>你已被踢出頻道 <yellow><name><red>。"

  leave-not-in-channel: "<red>你目前不處於任何玩家自訂頻道中！"
  leave-owner-forbidden: "<red>作為頻道隊長你無法直接退出！請使用 /pc manage delete 或 transfer。"
  leave-success: "<green>你已成功退出頻道 <yellow><name><green>。"

  transfer-usage: "<red>用法: /playerchannel manage transfer <玩家名稱>"
  transfer-not-member: "<red>目標玩家必須在線且為該頻道的成員！"
  transfer-success: "<green>已將頻道隊長轉讓給 <yellow><player><green>。"
  transfer-notify: "<green>你現在是頻道 <yellow><name> <green>的新隊長！"

  delete-success: "<red>已成功解散並刪除頻道 <yellow><name><red>。"

help:
  header: "<green>=== ChatConduit 幫助選單 ==="
  help-cmd: "<yellow>/chatconduit help <gray>- 顯示幫助訊息"
  reload-cmd: "<yellow>/chatconduit reload <gray>- 重載設定檔"

  channel-header: "<green>=== 頻道指令選單 ==="
  channel-switch: "<yellow>/channel <名稱> <gray>- 切換預設發言頻道"

  pc-header: "<green>=== 玩家個人頻道管理 (/pc) ==="
  pc-create: "<yellow>/pc create <名稱> <gray>- 建立個人頻道"
  pc-invite: "<yellow>/pc invite <玩家> <gray>- 邀請玩家加入頻道"
  pc-accept: "<yellow>/pc accept <名稱> <gray>- 接受頻道邀請"
  pc-leave: "<yellow>/pc leave <gray>- 退出當前頻道"
  pc-members: "<yellow>/pc members <gray>- 查看頻道成員清單"
  pc-kick: "<yellow>/pc manage kick <玩家> <gray>- 將玩家踢出頻道"
  pc-transfer: "<yellow>/pc manage transfer <玩家> <gray>- 轉讓隊長職位"
  pc-delete: "<yellow>/pc manage delete <gray>- 解散當前頻道"

mute:
  chat-blocked: "<red>You are muted for <time> Reason: <reason>"
  chat-blocked-perm: "<red>You are permanently muted. Reason: <reason>"
  broadcast: "<gradient:#ff416c:#ff4b2b>[系統公告]</gradient> <red>玩家 <yellow><player></yellow> 已被 <yellow><by></yellow> 禁言 <yellow><time></yellow>！原因: <gray><reason></gray>"
  broadcast-perm: "<gradient:#ff416c:#ff4b2b>[系統公告]</gradient> <red>玩家 <yellow><player></yellow> 已被 <yellow><by></yellow> 永久禁言！原因: <gray><reason></gray>"
  unmute-broadcast: "<gradient:#55ffff:#00aa00>[系統公告]</gradient> <green>玩家 <yellow><player></yellow> 的禁言已被 <yellow><by></yellow> 解除。"
  mute-usage: "<red>用法: /mute <玩家名稱> [時間 (例如 5m, 1h)] [原因]"
  unmute-usage: "<red>用法: /unmute <玩家名稱>"
  mute-success: "<green>已成功禁言玩家 <yellow><player></yellow> 時間: <yellow><time></yellow>！原因: <gray><reason></gray>"
  unmute-success: "<green>已成功解除玩家 <yellow><player></yellow> 的禁言！"
  unmuted-notice: "<green>您的禁言已被解除，現在可以正常發言。"
  not-muted: "<red>玩家 <yellow><player></yellow> 目前並未處於禁言狀態！"
  default-reason: "未提供原因"
  permanent: "永久"
  list-empty: "<yellow>目前沒有任何被禁言的玩家。"
  list-header: "<gradient:#ff416c:#ff4b2b><bold>=== 當前被禁言玩家清單 (共 <count> 人) ===</bold></gradient>"
  list-item: "<gray>- <yellow><player></yellow> | 剩餘時間: <aqua><time></aqua> | 原因: <white><reason></white> | 執行者: <gray><by></gray>"

msg:
  usage: "<red>用法: /msg <玩家名稱> <訊息內容>"
  reply-usage: "<red>用法: /reply <訊息內容>"
  player-not-found: "<red>找不到指定的線上玩家：<yellow><target>"
  cannot-msg-self: "<red>你不能傳送私訊給自己！"
  no-reply-target: "<red>你目前沒有可以回覆的私訊對象！"
  disabled: "<red>私訊功能目前已被管理員停用。"

friend:
  usage: "<red>用法: /friend <add|accept|deny|remove|list|block|unblock|gui|help>"
  add-success: "<green>已成功發送好友申請給 <yellow><target><green>！"
  add-cooldown: "<red>發送好友申請過於頻繁，請稍後再試！"
  add-blocked: "<red>無法發送好友申請給該玩家！"
  add-already-friends: "<yellow><target> <red>已經是您的好友了！"
  add-cannot-self: "<red>您不能添加自己為好友！"
  add-disabled: "<red>該玩家已關閉接受好友申請功能！"
  add-auto-accepted: "<green><target> 之前已向您發送過好友申請，雙方已自動成為好友！"
  add-failed: "<red>發送好友申請失敗，請稍後再試。"
  accept-success: "<green>您已成功接受 <yellow><target> <green>的好友申請！"
  accept-not-found: "<red>您沒有收到來自 <yellow><target> <red>的好友申請！"
  accept-failed: "<red>接受好友申請失敗。"
  deny-success: "<yellow>您已拒絕來自 <yellow><target> <yellow>的好友申請。"
  deny-not-found: "<red>您沒有收到來自 <yellow><target> <red>的好友申請！"
  remove-success: "<yellow>已成功刪除與 <white><target> <yellow>的好友關係。"
  remove-not-friend: "<red><target> 並不是您的好友！"
  block-success: "<green>已成功將 <yellow><target> <green>加入黑名單！"
  block-cannot-self: "<red>您不能將自己加入黑名單！"
  block-failed: "<red>將玩家加入黑名單失敗。"
  unblock-success: "<green>已成功將 <yellow><target> <green>移出黑名單！"
  unblock-not-blocked: "<red><target> 並不在您的黑名單中！"
  player-not-found: "<red>找不到玩家 <yellow><target><red>！"
  list-header: "<gradient:#00FFA3:#00B8FF><bold>=== 好友清單 (第 <page>/<total_pages> 頁，共 <total_friends> 人) ===</bold></gradient>"
  list-item-online: "<gray>- <green>● <yellow><name> <gray>(<aqua><server></aqua>)"
  list-item-offline: "<gray>- <dark_gray>● <gray><name> <dark_gray>(離線)"
  list-empty: "<yellow>您目前沒有任何好友。"
  list-invalid-page: "<red>無效的頁碼！"
  help-header: "<gradient:#00FFA3:#00B8FF><bold>=== 好友系統指令選單 ===</bold></gradient>"
  help-add: "<yellow>/friend add <玩家> <gray>- 發送好友申請"
  help-accept: "<yellow>/friend accept <玩家> <gray>- 接受好友申請"
  help-deny: "<yellow>/friend deny <玩家> <gray>- 拒絕好友申請"
  help-remove: "<yellow>/friend remove <玩家> <gray>- 刪除好友"
  help-list: "<yellow>/friend list [頁碼] <gray>- 查看好友清單"
  help-block: "<yellow>/friend block <玩家> <gray>- 將玩家加入黑名單"
  help-unblock: "<yellow>/friend unblock <玩家> <gray>- 將玩家移出黑名單"
  help-gui: "<yellow>/friend gui <gray>- 開啟好友箱子 GUI 選單"