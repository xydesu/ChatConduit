title: "<green><bold>好友列表 - 第 <page> / <total_pages> 頁</bold></green>"
size: 54

layout:
  - "#########"
  - "#FFFFFFF#"
  - "#FFFFFFF#"
  - "#FFFFFFF#"
  - "#########"
  - "B##P#N##A"

symbols:
  '#': "filler-glass"
  'F': "player-heads"
  'B': "back-button"
  'P': "prev-page"
  'N': "next-page"
  'A': "add-friend"

items:
  filler-glass:
    material: GRAY_STAINED_GLASS_PANE
    name: "<gray> "

  back-button:
    material: ARROW
    name: "<yellow><bold>← 返回主介面</bold></yellow>"
    lore:
      - "<gray>回到好友主選單"

  prev-page:
    material: PAPER
    name: "<yellow><bold>◄ 上一頁</bold></yellow>"

  next-page:
    material: PAPER
    name: "<yellow><bold>下一頁 ►</bold></yellow>"

  add-friend:
    material: ANVIL
    name: "<green><bold>➕ 手動新增好友</bold></green>"
    lore:
      - "<gray>可在對話框輸入玩家名稱發送好友申請"
      - ""
      - "<yellow>▶ 點擊開啟輸入對話框</yellow>"
