      - ""
      - "<yellow>▶ 點擊開啟目前所屬群組面板</yellow>"

  close-menu:
    slot: 49
    material: BARRIER
    name: "<red><bold>✖ 關閉選單</bold></red>"
    lore:
      - "<gray>點擊關閉此介面"

  pending-invites:
    slot: 50
    material: WRITABLE_BOOK
    name: "<green><bold>✉ 頻道邀請</bold> <pending_badge>"
    lore:
      - "<gray>查看收到的群組頻道邀請"
      - "<gray>當前未處理邀請: <yellow><pending_count> 個</yellow>"
      - ""
      - "<yellow>▶ 點擊開啟邀請選單</yellow>"

  message-settings:
    slot: 51
    material: BELL
    name: "<gradient:#ff9a9e:#fecfef><bold>🔔 個人訊息顯示設定</bold></gradient>"
    lore:
      - "<gray>開關個人畫面顯示之系統廣播"
      - "<gray>可切換: <yellow>死亡訊息</yellow> 與 <yellow>進出伺服器通知</yellow>"
      - ""
      - "<yellow>▶ 點擊開啟偏好設定選單</yellow>"
