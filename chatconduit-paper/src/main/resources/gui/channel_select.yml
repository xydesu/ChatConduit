    name: "<gray> "

  divider-line:
    slots: [27, 28, 29, 30, 31, 32, 33, 34, 35]
    material: BLUE_STAINED_GLASS_PANE
    name: "<blue> "

  prev-page:
    slot: 46
    material: ARROW
    name: "<yellow>◀ 上一頁 (第 <page> 頁)</yellow>"
    lore:
      - "<gray>點擊切換至上一頁"

  next-page:
    slot: 52
    material: ARROW
    name: "<yellow>下一頁 ▶ (第 <page> 頁)</yellow>"
    lore:
      - "<gray>點擊切換至下一頁"

  create-channel:
    slot: 47
    material: EMERALD
    name: "<green><bold>＋ 建立新群組頻道</bold></green>"
    lore:
      - "<gray>點擊即可輸入名稱建立自己的專屬頻道"
      - ""
      - "<yellow>▶ 點擊進行建立</yellow>"

  manage-channel:
    slot: 48
    material: NAME_TAG
    name: "<gold><bold>⚙ 群組頻道管理</bold></gold>"
    lore:
      - "<gray>提示：在上方自訂群組頻道圖示上"
