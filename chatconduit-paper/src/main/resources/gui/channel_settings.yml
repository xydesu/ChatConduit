      - ""
      - "<yellow>▶ 點擊開啟對話框修改頻道守則</yellow>"

  color-theme:
    slot: 14
    material: CYAN_DYE
    name: "<gold><bold>5. 頻道色彩主題樣式</bold></gold>"
    lore:
      - "<gray>當前色彩預設: <theme_preview>"
