    name: "<gold><bold>1. 存取權限模式</bold></gold>"
    lore:
      - "<gray>當前模式: <mode_status>"
      - "<gray>說明: <mode_desc>"
      - ""
      - "<yellow>▶ 點擊切換模式 (PUBLIC / PRIVATE)</yellow>"

  rename-channel:
    slot: 11
    material: NAME_TAG
    name: "<gold><bold>2. 修改頻道顯示名稱</bold></gold>"
    lore:
      - "<gray>當前顯示名稱: <current_name>"
