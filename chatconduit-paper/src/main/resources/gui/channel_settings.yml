      - ""
      - "<yellow>▶ 點擊切換下一個色彩主題</yellow>"

  webhook-setting:
    slot: 16
    skull-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvN2RhOTQ0OWNlYTEyMTE5YzIyY2E1YjkzYzI4Y2JlOWRmMzE1MjFjYTE1OWE1ZWE1ZmFhNWZmYjVhMTc4MGY1NyJ9fX0="
    name: "<gold><bold>6. 設定專屬 Discord Webhook</bold></gold>"
    lore:
      - "<gray>綁定狀態: <webhook_status>"
      - "<gray>網址預覽: <yellow><webhook_preview></yellow>"
      - "<gray>說明: 成員發言時自動 POST 至您的 Discord 頻道"
      - ""
      - "<yellow>▶ 點擊開啟對話框輸入 Webhook URL</yellow>"
      - "<gray>(如需解除綁定請在對話框輸入 clear)</gray>"

  test-webhook:
    slot: 17
    name: "<gold><bold>7. 測試 Webhook 連線</bold></gold>"
    # Lore 與 Material 將在程式中根據 hasWebhook 狀態動態調整

  back-button:
    slot: 22
    material: ARROW
    name: "<yellow><bold>← 返回群組管理</bold></yellow>"
    lore:
      - "<gray>回到頻道管理頁面"
