  channel-description:
    slot: 12
    material: BOOK
    name: "<gold><bold>3. 頻道簡介說明</bold></gold>"
    lore:
      - "<gray>當前簡介: <white><current_desc></white>"
      - "<gray>說明: 展示於全服聊天欄頻道 Prefix 滑鼠懸停提示中"
      - ""
      - "<yellow>▶ 點擊開啟對話框修改頻道簡介</yellow>"

  channel-rules:
    slot: 13
    material: PAPER
    name: "<gold><bold>4. 頻道規則與規範</bold></gold>"
    lore:
      - "<gray>當前規則: <white><current_rules></white>"
