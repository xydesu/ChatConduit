<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Base Background Hexagon -->
  <path d="M256 32 L448 142 L448 370 L256 480 L64 370 L64 142 Z" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>
  <!-- Circuit Nodes -->
  <circle cx="256" cy="120" r="16" fill="url(#cyanGrad)"/>
  <circle cx="150" cy="340" r="14" fill="url(#cyanGrad)"/>
  <circle cx="362" cy="340" r="14" fill="url(#cyanGrad)"/>
  <!-- Connection Conduit Paths -->
  <path d="M256 136 L256 220 M150 326 L220 270 M362 326 L292 270" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Main Chat Bubble Icon -->
  <path d="M160 190 H352 C374.1 190 392 207.9 392 230 V290 C392 312.1 374.1 330 352 330 H280 L220 370 V330 H160 C137.9 330 120 312.1 120 290 V230 C120 207.9 137.9 190 160 190 Z" fill="url(#purpleGrad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Inner Chat Conduit Signals -->
  <rect x="170" y="240" width="80" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="170" y="265" width="130" height="12" rx="6" fill="#00FFA3"/>
  <circle cx="335" cy="246" r="8" fill="#FFFFFF"/>
</svg>
