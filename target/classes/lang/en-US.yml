# English Language Configuration
prefix: "<gradient:#55ffff:#00aa00>[ChatConduit]</gradient> "

messages:
  no-permission: "<red>You do not have permission to execute this command!"
  reload-success: "<green>Configuration and language files reloaded successfully!"
  unknown-command: "<red>Unknown command, please use <yellow>/chatconduit help</yellow>."

channel:
  current: "<gray>Your current active channel: <yellow><channel_name>"
  switched: "<green>Switched active channel to: <yellow><channel_name>"
  not-found: "<red>Channel not found!"
  no-permission: "<red>You do not have permission to access or switch to this channel!"
  not-in-group: "<red>You are no longer in this group channel! Reverted to default channel."

  # Channel Command Descriptions
  list-header: "<green>=== Available Channels ==="
  list-item: "<gray>- <yellow><key> <gray>(<white><name><gray>) Prefix: <gold><prefix_key>"

  # Player Custom Channels
  create-usage: "<red>Usage: /channel create <ChannelName>"
  create-success: "<green>Successfully created channel <yellow><name>!"
  create-exists: "<red>A channel with this ID already exists!"
  invalid-mode: "<red>Channel mode must be either 'public' or 'private'!"

  invite-usage: "<red>Usage: /channel invite <Player>"
  invite-not-owner: "<red>You must be the owner of your current custom channel to invite players!"
  invite-player-not-found: "<red>Player not found!"
  invite-sent: "<green>Invitation sent to <yellow><player>."
  invite-received: "<yellow><player> invited you to join channel [<green><name><yellow>]. Type <gold>/channel accept <id> <yellow>to join!"

  accept-usage: "<red>Usage: /channel accept <ChannelID>"
  accept-no-invite: "<red>You do not have a pending invitation for this channel!"
  accept-success: "<green>Successfully joined channel <yellow><name>!"

  join-usage: "<red>Usage: /channel join <ChannelID>"
  join-private: "<red>This is a private channel. You cannot join without an invitation!"
  join-success: "<green>Successfully joined and switched to <yellow><name>!"

help:
  header: "<green>=== ChatConduit Commands ==="
  help-cmd: "<yellow>/chatconduit help <gray>- Show this help menu"
  reload-cmd: "<yellow>/chatconduit reload <gray>- Reload plugin configuration files"

  channel-header: "<green>=== Channel Commands ==="
  channel-switch: "<yellow>/channel <ID> <gray>- Switch active channel"
  channel-create: "<yellow>/channel create <Name> <gray>- Create custom channel"
  channel-join: "<yellow>/channel join <ID> <gray>- Join a public custom channel"
  channel-invite: "<yellow>/channel invite <Player> <gray>- Invite a player to your private channel"
  channel-accept: "<yellow>/channel accept <ID> <gray>- Accept a channel invitation"