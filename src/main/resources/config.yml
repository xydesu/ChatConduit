# ChatConduit 主要設定檔

# 選擇語言檔 (無須副檔名，對應 lang/ 內部的檔案名稱)
# 可用選項: "zh-TW", "en-US" 等
language: "zh-TW"
# 預設發言頻道
default-channel: "global"

# 聊天格式統一模板 (可用 <channel_color>, <channel_name>, <player>, <message>, %papi%)
chat-format: "<white>[<channel_color><channel_name><white>] <gray>[%luckperms_prefix%<gray>] <white><player>> <white><message>"

# DiscordSRV 雙向轉發設定
discordsrv:
  enabled: true
  # 是否同步將玩家自訂群組頻道的聊天訊息轉發至 DiscordSRV
  forward-custom-group-channels: true

# 頻道設定清單 (只設定 name, color, prefix-key, permission)
channels:
  global:
    name: "公共"
    color: "<gradient:#00d2ff:#3a7bd5>"
    prefix-key: "!"
    permission: ""

  trade:
    name: "交易"
    color: "<gradient:#ffb347:#ffcc33>"
    prefix-key: "$"
    permission: ""

  party:
    name: "組隊"
    color: "<gradient:#a8ff78:#78ffd6>"
    prefix-key: "+"
    permission: ""

  ask:
    name: "詢問"
    color: "<gradient:#ee9ca7:#ffadc7>"
    prefix-key: "?"
    permission: ""

  chitchat:
    name: "閒聊"
    color: "<gradient:#f78ca0:#fe9a8b>"
    prefix-key: "~"
    permission: ""

  facility:
    name: "設施"
    color: "<gradient:#43e97b:#38f9d7>"
    prefix-key: "@"
    permission: ""

  lottery:
    name: "抽獎"
    color: "<gradient:#f83600:#fe8c00>"
    prefix-key: "*"
    permission: ""