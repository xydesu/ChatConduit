# 伺服器識別名稱 (多伺服器跨服模式使用，如 "survival-1", "lobby")
server-id: "survival-1"

# 聊天格式統一模板 (可用 <channel_prefix>, {server}, <player>, <message>, %papi%)
# 提示: 若非跨服訊息或 server-id 為空，{server} 將自動不顯示
chat-format: "<white><channel_prefix> <dark_gray>[<gray>{server}<dark_gray>] <gray>[%luckperms_prefix%<gray>] <white><player>> <white><message>"

# 玩家自訂群組頻道相關安全與數量限制設定
player-channels:
  # 單一玩家最多允許創建的群組頻道數量
  max-per-player: 3
  # 對話框輸入 (GUI Input) 超時時間 (秒)
  session-timeout-seconds: 45

# 資料庫 (Database) 設定
database:
  # 資料庫類型 (可選: "sqlite", "mysql")
  type: "sqlite"
  # SQLite 資料庫檔名 (位於 plugins/ChatConduit/ 內)
  sqlite-file: "storage.db"

  # MySQL / MariaDB 設定 (僅當 type 設定為 "mysql" 時生效)
  mysql:
    host: "localhost"
    port: 3306
    database: "chatconduit"
    username: "root"
    password: ""
    # HikariCP 連線池設定
    pool-size: 10
    max-lifetime: 1800000 # 毫秒 (30分鐘)
    connection-timeout: 10000 # 毫秒 (10秒)

# Redis 跨伺服器通訊 Pub/Sub 設定
redis:
  # 是否啟用 Redis 跨伺服器聊天訊息廣播與頻道同步
  enabled: false
  host: "localhost"
  port: 6379
  password: ""
  ssl: false
  # Redis 訂閱與廣播頻道名稱
  channel: "chatconduit:global_chat"
  # Jedis 連線池最大連線數
  max-connections: 8
  # 連線超時時間 (毫秒)
  timeout: 2000



# DiscordSRV 雙向轉發與 Webhook 設定
discordsrv:
  enabled: true
  # 是否將玩家自訂的私人/公開群組頻道訊息轉發至 Discord（預設 false 保障玩家群組隱私）
  forward-custom-group-channels: false

  # 玩家自訂頻道專屬 Webhook 設定
  webhook:
    # 是否允許頻道隊長設定個人專屬外接 Discord Webhook 連結
    allow-custom-webhooks: true
    # Webhook 機器人顯示名稱模板 (%player%: 玩家名稱, %channel%: 頻道名稱)
    username-format: "%player% [%channel%]"
    # 玩家皮膚頭像網址渲染服務 (%player%: 玩家名稱, %uuid%: 玩家 UUID)
    avatar-url: "https://mc-heads.net/avatar/%player%/64"

  # 遊戲內頻道與 Discord 文字頻道對應映射表 (格式: 遊戲頻道Key: "Discord頻道ID或頻道名稱")
  channel-mapping:
    global: "global"
    trade: "trade"
    party: "party"
    ask: "ask"
    chitchat: "chitchat"
    facility: "facility"
    lottery: "lottery"

# 頻道設定清單 (可設定 name, color, prefix-key, permission, description, rules)
channels:
  global:
    name: "公共"
    color: "<gradient:#00d2ff:#3a7bd5>"
    prefix-key: "!"
    permission: ""
    description: "全服公共玩家對話頻道，交流與共享伺服器資訊。"
    rules: "聊天請遵循禮貌，禁止刷屏洗版、人身攻擊或散布廣告。"

  trade:
    name: "交易"
    color: "<gradient:#ffb347:#ffcc33>"
    prefix-key: "$"
    permission: ""
    description: "專供玩家進行物品、資源與裝備買賣交流頻道。"
    rules: "請誠實交易，嚴禁詐騙或張貼非交易相關之洗版訊息。"

  party:
    name: "組隊"
    color: "<gradient:#a8ff78:#78ffd6>"
    prefix-key: "+"
    permission: ""
    description: "組隊、副本招募與冒險團隊即時溝通頻道。"
    rules: "友善徵人，禁止散布不實副本資訊。"

  ask:
    name: "詢問"
    color: "<gradient:#ee9ca7:#ffadc7>"
    prefix-key: "?"
    permission: ""
    description: "新手發問、遊戲疑難雜症解答與求助頻道。"
    rules: "歡迎有禮貌地提出問題，解答者請耐心回覆。"

  chitchat:
    name: "閒聊"
    color: "<gradient:#f78ca0:#fe9a8b>"
    prefix-key: "~"
    permission: ""
    description: "輕鬆閒聊、日常生活話家常專用對話頻道。"
    rules: "保持輕鬆愉快，禁止涉及過度敏感話題。"

  facility:
    name: "設施"
    color: "<gradient:#43e97b:#38f9d7>"
    prefix-key: "@"
    permission: ""
    description: "公共設施、紅石建築與伺服器建設討論頻道。"
    rules: "交流建設技術，禁止惡意破壞討論。"

  lottery:
    name: "抽獎"
    color: "<gradient:#f83600:#fe8c00>"
    prefix-key: "*"
    permission: ""
    description: "伺服器抽獎活動與幸運獎項廣播頻道。"
    rules: "理性參與抽獎活動。"