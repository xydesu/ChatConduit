# ChatConduit 主要設定檔

# 選擇語言檔 (無須副檔名，對應 lang/ 內部的檔案名稱)
# 可用選項: "zh-TW", "en-US" 等
language: "zh-TW"
# 預設發言頻道
default-channel: "global"

# 聊天格式統一模板 (可用 <channel_color>, <channel_name>, <player>, <message>, %papi%)
chat-format: "<white>[<channel_color><channel_name><white>] <gray>[%luckperms_prefix%<gray>] <white><player>> <white><message>"

# DiscordSRV 雙向轉發與 Webhook 設定
discordsrv:
  enabled: true
  # 是否將玩家自訂的私人/公開群組頻道訊息轉發至 Discord（預設 false 保障玩家群組隱私）
  forward-custom-group-channels: false

  # 玩家自訂頻道專屬 Webhook 設定
  webhook:
    # 是否允許頻道隊長設定個人專屬外接 Discord Webhook 連結
    allow-custom-webhooks: true
    # Webhook 機器人顯示名稱模板 (%player%: 玩家名稱, %channel%: 頻道名稱)
    username-format: "%player% [%channel%]"
    # 玩家皮膚頭像網址渲染服務 (%player%: 玩家名稱, %uuid%: 玩家 UUID)
    avatar-url: "https://mc-heads.net/avatar/%player%/64"

  # 遊戲內頻道與 Discord 文字頻道對應映射表 (格式: 遊戲頻道Key: "Discord頻道ID或頻道名稱")
  channel-mapping:
    global: "global"
    trade: "trade"
    party: "party"
    ask: "ask"
    chitchat: "chitchat"
    facility: "facility"
    lottery: "lottery"

# 頻道設定清單 (只設定 name, color, prefix-key, permission)
channels:
  global:
    name: "公共"
    color: "<gradient:#00d2ff:#3a7bd5>"
    prefix-key: "!"
    permission: ""

  trade:
    name: "交易"
    color: "<gradient:#ffb347:#ffcc33>"
    prefix-key: "$"
    permission: ""

  party:
    name: "組隊"
    color: "<gradient:#a8ff78:#78ffd6>"
    prefix-key: "+"
    permission: ""

  ask:
    name: "詢問"
    color: "<gradient:#ee9ca7:#ffadc7>"
    prefix-key: "?"
    permission: ""

  chitchat:
    name: "閒聊"
    color: "<gradient:#f78ca0:#fe9a8b>"
    prefix-key: "~"
    permission: ""

  facility:
    name: "設施"
    color: "<gradient:#43e97b:#38f9d7>"
    prefix-key: "@"
    permission: ""

  lottery:
    name: "抽獎"
    color: "<gradient:#f83600:#fe8c00>"
    prefix-key: "*"
    permission: ""